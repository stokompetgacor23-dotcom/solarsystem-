#sw{position:relative;flex:1;max-width:340px;margin-left:auto}

#ctl{position:fixed;left:80px;right:8px;bottom:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:4}

button.b:hover,button.b.on{background:rgba(90,176,255,.38)}
#ctl label{color:var(--mu);font-size:11px;display:flex;align-items:center;gap:4px}

.pg{position:fixed;left:80px;right:8px;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:8px;padding:16px;overflow:auto;display:none;z-index:7;background:rgba(5,10,24,.92)}
.pg h2{margin:0 0 10px}.pg h3{margin:14px 0 4px;color:var(--ac)}.pg a{color:var(--ac)}

.bar{height:6px;background:var(--ac);border-radius:3px;margin-top:3px}
.lb{position:fixed;font-size:10px;color:#cfe3ff;pointer-events:none;transform:translate(-50%,-130%);text-shadow:0 0 4px #000;white-space:nowrap;z-index:3}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px;background:rgba(90,176,255,.1);border:1px solid var(--ln);color:var(--tx);border-radius:8px;cursor:pointer;font-size:13px}
.ok{background:rgba(60,200,120,.35)!important}.no{background:rgba(230,70,70,.35)!important}
#load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;letter-spacing:.2em;font-size:12px;color:var(--ac)}

#info>div:last-child{position:sticky;bottom:-14px;background:rgb(10,15,27);padding:10px 0 4px;margin-top:8px;border-top:1px solid var(--ln)}
.ft span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:2px}
@media(max-width:720px){
